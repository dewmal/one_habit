name: Android Release

# Runs when a version tag such as v1.0.0 is pushed.
# Builds the Android APK and AAB and attaches them to a GitHub Release for that tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      GATEWAY_URL: ${{ vars.GATEWAY_URL }}
    steps:
      - name: Work out tag and version
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Fail rather than publish a debug-signed build.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Check gateway URL
        run: |
          # Fail rather than ship a build that cannot reach the gateway.
          if [ -z "$GATEWAY_URL" ]; then
            echo "::error::GATEWAY_URL is not set. Add it under Settings > Secrets and variables > Actions > Variables (e.g. https://<domain>/chat)."
            exit 1
          fi

      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define=GATEWAY_URL=$GATEWAY_URL
          --build-name=${{ steps.meta.outputs.version }}
          --build-number=${{ steps.meta.outputs.build_number }}

      - name: Build App Bundle
        run: >
          flutter build appbundle --release
          --dart-define=GATEWAY_URL=$GATEWAY_URL
          --build-name=${{ steps.meta.outputs.version }}
          --build-number=${{ steps.meta.outputs.build_number }}

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/one_preccent-${{ steps.meta.outputs.version }}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "dist/one_preccent-${{ steps.meta.outputs.version }}-android.aab"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
